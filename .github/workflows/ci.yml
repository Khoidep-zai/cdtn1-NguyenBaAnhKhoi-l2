name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Automated Unit & Integration Tests (SE Track)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: cdtn1_warranty_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: cdtn1_warranty_db
      DB_USER: postgres
      DB_PASSWORD: postgres_ci_password
      JWT_SECRET: integration-test-secret-32-bytes-minimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies strictly by lockfile
        run: npm ci

      - name: Run database migration
        run: npm run db:migrate

      - name: Run test suite with built-in node test runner
        run: npm test
