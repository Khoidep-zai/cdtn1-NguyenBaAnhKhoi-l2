[build]
  command = "npm run build"
  publish = "src/frontend"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_DRAWER = "false"

[functions]
  included_files = ["dataset/**"]
  node_bundler = "esbuild"

# Rewrite /api/* to the serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Rewrite /health to the serverless Express function
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

# Rewrite /health/* to the serverless Express function
[[redirects]]
  from = "/health/*"
  to = "/.netlify/functions/api/health/:splat"
  status = 200

# SPA fallback for frontend client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers (OWASP & Buoi 15 CDTN1)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
